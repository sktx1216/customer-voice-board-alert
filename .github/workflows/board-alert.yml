name: Board Alert

on:
  schedule:
    - cron: "17 0-8 * * *"
  workflow_dispatch:

jobs:
  check-board:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: .board_state
          key: board-alert-state-${{ github.run_id }}
          restore-keys: |
            board-alert-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check board and send email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          STATE_FILE: .board_state/last_seen.json
        run: python check_board.py
